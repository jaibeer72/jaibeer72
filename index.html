<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jaibeer Singh — Portfolio</title>
  <meta name="description" content="Senior Software Engineer — C++, Graphics, Backend, Games" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ===================== HERO ===================== -->
<header id="hero">
  <div class="container">
    <div class="hero-inner">
      <div>
        <h1 class="hero-name" id="hero-name"><!-- js --></h1>
        <p class="hero-title" id="hero-title"><!-- js --></p>
        <p class="hero-tagline" id="hero-tagline"><!-- js --></p>
      </div>
      <div class="hero-links" id="hero-links"><!-- js --></div>
    </div>
  </div>
</header>

<!-- ===================== SITE NAV ===================== -->
<nav id="site-nav">
  <div class="container">
    <div class="nav-inner">
      <button class="nav-tab active" data-section="about">About</button>
      <button class="nav-tab" data-section="experience">Experience</button>
      <button class="nav-tab" data-section="projects">Projects</button>
    </div>
  </div>
</nav>

<!-- ===================== MAIN ===================== -->
<main>

  <!-- ---- ABOUT ---- -->
  <section id="about" class="site-section visible">
    <div class="container">
      <p class="section-label">Professional Summary</p>
      <div class="summary-box" id="summary-box"><!-- js --></div>

      <p class="section-label">Technical Skills</p>
      <div class="skills-grid" id="skills-grid"><!-- js --></div>

      <p class="section-label">Education</p>
      <div class="edu-list" id="edu-list"><!-- js --></div>

      <p class="section-label" style="margin-top:2rem">Certifications</p>
      <div class="cert-list" id="cert-list"><!-- js --></div>
    </div>
  </section>

  <!-- ---- EXPERIENCE ---- -->
  <section id="experience" class="site-section">
    <div class="container">
      <p class="section-label">Career Timeline</p>
      <h2 class="section-title">Experience</h2>

      <!-- tab row: newest → oldest -->
      <div class="exp-tab-row" id="exp-tab-row"><!-- js --></div>

      <!-- prev / next controls -->
      <div class="exp-nav">
        <button class="exp-nav-btn" id="exp-prev" aria-label="Previous" disabled>← Prev</button>
        <span class="exp-nav-counter" id="exp-counter"></span>
        <button class="exp-nav-btn" id="exp-next" aria-label="Next">Next →</button>
      </div>

      <!-- carousel viewport clips the sliding track -->
      <div class="exp-carousel-viewport">
        <div id="exp-panels"><!-- js --></div>
      </div>
    </div>
  </section>

  <!-- ---- PROJECTS ---- -->
  <section id="projects" class="site-section">
    <div class="container">
      <p class="section-label">Selected Work</p>
      <h2 class="section-title">Projects</h2>
      <div class="projects-grid" id="projects-grid"><!-- js --></div>
    </div>
  </section>

</main>

<!-- ===================== FOOTER ===================== -->
<footer>
  <div class="container">
    <div class="footer-inner">
      <a id="footer-hire" class="footer-hire" hidden>✉ Hire Me</a>
      <span id="footer-text"><!-- js --></span>
    </div>
  </div>
</footer>

<!-- ===================== REDIRECT MODAL ===================== -->
<div id="redirect-modal" class="modal-overlay" hidden>
  <div class="modal-box">
    <p class="modal-title">Leaving this page</p>
    <p class="modal-body">
      You're about to open
      <span id="modal-dest-name" class="modal-dest"></span>
      in a new tab.
    </p>
    <div class="modal-actions">
      <button id="modal-cancel" class="btn">Cancel</button>
      <a id="modal-confirm" class="btn btn-gold" target="_blank" rel="noopener">Go there →</a>
    </div>
  </div>
</div>

<!-- ===================== PROJECT BOTTOM SHEET ===================== -->
<div id="proj-sheet-overlay" class="sheet-overlay" hidden>
  <div id="proj-sheet" class="proj-sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-header">
      <div>
        <p id="sheet-stack" class="sheet-stack"></p>
        <h2 id="sheet-title" class="sheet-title"></h2>
      </div>
      <button id="sheet-close" class="sheet-close-btn" aria-label="Close">✕</button>
    </div>
    <div class="sheet-body">
      <div id="sheet-image-wrap" class="sheet-image-wrap"></div>
      <p id="sheet-desc" class="sheet-desc"></p>
      <ul id="sheet-details" class="sheet-details"></ul>
      <div id="sheet-links" class="sheet-links"></div>
    </div>
  </div>
</div>

<!-- data first, then renderer -->
<script src="data.js"></script>
<script>
(function () {
  "use strict";

  /* ── helpers ─────────────────────────────────────────── */
  function el(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html !== undefined) e.innerHTML = html;
    return e;
  }

  function esc(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  /* ── keyword cross-link helpers ──────────────────────── */
  function escRe(str) {
    return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }

  function linkify(text) {
    if (!d.keywords || !d.keywords.length) return esc(text);
    /* longest keywords first so "Nintendo Switch" wins over "Switch" */
    var sorted = d.keywords.slice().sort(function (a, b) {
      return b.word.length - a.word.length;
    });
    var result = esc(text);
    sorted.forEach(function (kw) {
      var safe = esc(kw.word);
      var re   = new RegExp(escRe(safe), 'g');
      result   = result.replace(re,
        '<button class="kw-link" data-kw-type="' + esc(kw.type) +
        '" data-kw-id="' + esc(kw.id) + '">' + safe + '</button>');
    });
    return result;
  }

  /* switches tabs + makes the target section visible */
  function showSection(sectionId) {
    document.querySelectorAll(".nav-tab").forEach(function (t) {
      t.classList.toggle("active", t.dataset.section === sectionId);
    });
    document.querySelectorAll(".site-section").forEach(function (s) {
      s.classList.toggle("visible", s.id === sectionId);
    });
  }

  /* keyword click → navigate to the linked experience or project */
  function navigateTo(type, id) {
    if (type === "project") {
      showSection("projects");
      openSheet(id);
    } else if (type === "experience") {
      showSection("experience");
      var idx = 0;
      d.experience.forEach(function (exp, i) { if (exp.id === id) idx = i; });
      goToExp(idx);
    }
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  /* ── REDIRECT MODAL (shared) ──────────────────────────── */
  var modal        = document.getElementById("redirect-modal");
  var modalName    = document.getElementById("modal-dest-name");
  var modalConfirm = document.getElementById("modal-confirm");
  var modalCancel  = document.getElementById("modal-cancel");

  function openRedirect(href, label) {
    modalName.textContent = label || href;
    modalConfirm.href = href;
    modal.removeAttribute("hidden");
  }

  function closeRedirect() { modal.setAttribute("hidden", ""); }

  modalCancel.addEventListener("click", closeRedirect);
  modal.addEventListener("click", function (ev) { if (ev.target === modal) closeRedirect(); });
  modalConfirm.addEventListener("click", closeRedirect);

  /* ── HERO ─────────────────────────────────────────────── */
  var d = RESUME_DATA;

  document.getElementById("hero-name").innerHTML =
    esc(d.name).replace(/(\S+)$/, "<span>$1</span>");
  document.getElementById("hero-title").textContent = d.title;
  document.getElementById("hero-tagline").textContent = d.tagline;

  var linksEl = document.getElementById("hero-links");

  function makeHeroLink(href, label) {
    var a = el("a", "btn");
    a.href = href;
    a.dataset.label = label;
    a.innerHTML = label;
    linksEl.appendChild(a);
  }

  if (d.contact.github)   makeHeroLink(d.contact.github,   "GitHub");
  if (d.contact.linkedin) makeHeroLink(d.contact.linkedin, "LinkedIn");
  if (d.contact.itch)     makeHeroLink(d.contact.itch,     "itch.io");

  if (d.contact.hireMe) {
    var hireBtn = el("a", "btn btn-gold");
    hireBtn.href = d.contact.hireMe;
    hireBtn.dataset.label = "Hire Me";
    hireBtn.innerHTML = "✉ Hire Me";
    linksEl.appendChild(hireBtn);
  }

  linksEl.addEventListener("click", function (ev) {
    var a = ev.target.closest("a.btn");
    if (!a) return;
    ev.preventDefault();
    openRedirect(a.href, a.dataset.label || a.textContent);
  });

  /* ── ABOUT ────────────────────────────────────────────── */
  var summaryBox = document.getElementById("summary-box");
  summaryBox.innerHTML = linkify(d.summary);
  summaryBox.addEventListener("click", function (ev) {
    var btn = ev.target.closest(".kw-link");
    if (!btn) return;
    navigateTo(btn.dataset.kwType, btn.dataset.kwId);
  });

  var sg = document.getElementById("skills-grid");
  d.skills.forEach(function (s) {
    var row = el("div", "skill-row");
    row.appendChild(el("span", "skill-label", esc(s.label)));
    row.appendChild(el("span", "skill-value", esc(s.value)));
    sg.appendChild(row);
  });

  var eduList = document.getElementById("edu-list");
  d.education.forEach(function (e) {
    var card = el("div", "edu-card");
    card.appendChild(el("div", "edu-degree", esc(e.degree)));
    card.appendChild(el("div", "edu-inst",   esc(e.institution)));
    card.appendChild(el("div", "edu-period", esc(e.period)));
    eduList.appendChild(card);
  });

  var certList = document.getElementById("cert-list");
  d.certifications.forEach(function (c) {
    certList.appendChild(el("span", "cert-chip", esc(c)));
  });

  /* ── EXPERIENCE ───────────────────────────────────────── */
  var tabRow   = document.getElementById("exp-tab-row");
  var panelsEl = document.getElementById("exp-panels");
  var prevBtn  = document.getElementById("exp-prev");
  var nextBtn  = document.getElementById("exp-next");
  var counter  = document.getElementById("exp-counter");
  var total    = d.experience.length;
  var currentIdx = 0;

  d.experience.forEach(function (exp, idx) {
    /* tab button */
    var btn = el("button", "exp-tab-btn" + (idx === 0 ? " active" : ""));
    btn.dataset.idx = idx;
    btn.textContent = exp.tag;
    tabRow.appendChild(btn);

    /* panel */
    var panel = el("div", "exp-panel");
    panel.id = "panel-" + exp.id;

    var card = el("div", "exp-card");

    var header = el("div", "exp-header");
    var leftCol = el("div", "exp-header-left");
    leftCol.appendChild(el("div", "exp-role",     esc(exp.role)));
    leftCol.appendChild(el("div", "exp-company",  esc(exp.company)));
    leftCol.appendChild(el("div", "exp-location", esc(exp.location)));
    var rightCol = el("div", "exp-meta");
    rightCol.textContent = exp.period;
    header.appendChild(leftCol);
    header.appendChild(rightCol);
    card.appendChild(header);

    card.appendChild(el("div", "exp-stack", esc(exp.stack)));

    if (exp.shipped && exp.shipped.length) {
      var shippedRow = el("div", "shipped-row");
      shippedRow.appendChild(el("span", "shipped-label", "Shipped:"));
      exp.shipped.forEach(function (title) {
        var a = el("a", "shipped-badge ext-link", esc(title.name));
        a.href = title.url;
        a.dataset.label = title.name;
        shippedRow.appendChild(a);
      });
      card.appendChild(shippedRow);
    }

    var ul = el("ul", "exp-highlights");
    exp.highlights.forEach(function (h) {
      ul.appendChild(el("li", null, esc(h)));
    });
    card.appendChild(ul);

    panel.appendChild(card);
    panelsEl.appendChild(panel);
  });

  /* intercept shipped-badge clicks → redirect modal */
  panelsEl.addEventListener("click", function (ev) {
    var a = ev.target.closest(".ext-link");
    if (!a) return;
    ev.preventDefault();
    openRedirect(a.href, a.dataset.label || a.textContent);
  });

  /* go to a 0-based index (no scroll — we use CSS translate) */
  function goToExp(idx) {
    idx = Math.max(0, Math.min(total - 1, idx));
    currentIdx = idx;

    /* shift the track */
    panelsEl.style.transform = "translateX(-" + (idx * 100) + "%)";

    /* sync tab buttons */
    var btns = tabRow.querySelectorAll(".exp-tab-btn");
    btns.forEach(function (b, i) { b.classList.toggle("active", i === idx); });
    if (btns[idx]) btns[idx].scrollIntoView({ behavior: "smooth", block: "nearest", inline: "center" });

    prevBtn.disabled = idx === 0;
    nextBtn.disabled = idx === total - 1;
    counter.textContent = (idx + 1) + " / " + total;
  }

  /* initialise */
  goToExp(0);

  /* tab click */
  tabRow.addEventListener("click", function (ev) {
    var btn = ev.target.closest(".exp-tab-btn");
    if (!btn) return;
    goToExp(parseInt(btn.dataset.idx, 10));
  });

  /* arrow buttons */
  prevBtn.addEventListener("click", function () { goToExp(currentIdx - 1); });
  nextBtn.addEventListener("click", function () { goToExp(currentIdx + 1); });

  /* touch / swipe support */
  var touchStartX = null;
  var touchStartY = null;
  panelsEl.addEventListener("touchstart", function (ev) {
    touchStartX = ev.touches[0].clientX;
    touchStartY = ev.touches[0].clientY;
  }, { passive: true });
  /* non-passive so we can call preventDefault() for horizontal swipes,
     preventing iOS Safari from hijacking the gesture as a page scroll */
  panelsEl.addEventListener("touchmove", function (ev) {
    if (touchStartX === null) return;
    var dx = ev.touches[0].clientX - touchStartX;
    var dy = ev.touches[0].clientY - touchStartY;
    if (Math.abs(dx) > Math.abs(dy)) ev.preventDefault();
  }, { passive: false });
  panelsEl.addEventListener("touchend", function (ev) {
    if (touchStartX === null) return;
    var dx = ev.changedTouches[0].clientX - touchStartX;
    touchStartX = null;
    touchStartY = null;
    if (Math.abs(dx) > 40) goToExp(currentIdx + (dx < 0 ? 1 : -1));
  }, { passive: true });
  panelsEl.addEventListener("touchcancel", function () {
    touchStartX = null;
    touchStartY = null;
  }, { passive: true });

  /* ── PROJECTS ─────────────────────────────────────────── */
  var grid = document.getElementById("projects-grid");

  d.projects.forEach(function (proj) {
    var card = el("div", "proj-card");
    card.dataset.projId = proj.id;
    card.setAttribute("role", "button");
    card.setAttribute("tabindex", "0");
    card.setAttribute("aria-label", "View details for " + proj.name);
    card.appendChild(el("div", "proj-name", esc(proj.name)));
    card.appendChild(el("div", "proj-stack", esc(proj.stack)));
    card.appendChild(el("p",   "proj-desc",  esc(proj.description)));
    if (proj.links && proj.links.length) {
      var hint = el("div", "proj-hint", "Click for details &amp; links →");
      card.appendChild(hint);
    } else {
      var hint = el("div", "proj-hint", "Click for details →");
      card.appendChild(hint);
    }
    grid.appendChild(card);
  });

  /* ── PROJECT BOTTOM SHEET ─────────────────────────────── */
  var sheetOverlay = document.getElementById("proj-sheet-overlay");
  var sheetClose   = document.getElementById("sheet-close");
  var sheetTitle   = document.getElementById("sheet-title");
  var sheetStack   = document.getElementById("sheet-stack");
  var sheetDesc    = document.getElementById("sheet-desc");
  var sheetDetails = document.getElementById("sheet-details");
  var sheetLinks   = document.getElementById("sheet-links");
  var sheetImgWrap = document.getElementById("sheet-image-wrap");
  var savedScrollY = 0;

  function openSheet(projId) {
    var proj = d.projects.find(function (p) { return p.id === projId; });
    if (!proj) return;

    sheetTitle.textContent = proj.name;
    sheetStack.textContent = proj.stack;
    sheetDesc.textContent  = proj.description;

    /* image */
    sheetImgWrap.innerHTML = "";
    if (proj.image) {
      var img = document.createElement("img");
      img.src = proj.image;
      img.alt = proj.name + " preview";
      img.className = "sheet-img";
      sheetImgWrap.appendChild(img);
    }

    /* details */
    sheetDetails.innerHTML = "";
    if (proj.details && proj.details.length) {
      proj.details.forEach(function (d) {
        sheetDetails.appendChild(el("li", null, esc(d)));
      });
    }

    /* links */
    sheetLinks.innerHTML = "";
    if (proj.links && proj.links.length) {
      proj.links.forEach(function (lnk) {
        var a = el("a", "btn btn-gold sheet-ext-link", esc(lnk.label) + " →");
        a.href = lnk.url;
        a.dataset.label = lnk.label;
        sheetLinks.appendChild(a);
      });
    }

    sheetOverlay.removeAttribute("hidden");
    /* iOS Safari scroll-lock: fix body at current scroll position */
    savedScrollY = window.pageYOffset;
    document.body.style.top = '-' + savedScrollY + 'px';
    document.body.classList.add("sheet-open");
    sheetClose.focus();
  }

  function closeSheet() {
    sheetOverlay.setAttribute("hidden", "");
    document.body.classList.remove("sheet-open");
    document.body.style.top = '';
    window.scrollTo(0, savedScrollY);
  }

  /* project card click / keyboard */
  grid.addEventListener("click", function (ev) {
    var card = ev.target.closest(".proj-card");
    if (!card) return;
    openSheet(card.dataset.projId);
  });

  grid.addEventListener("keydown", function (ev) {
    if (ev.key === "Enter" || ev.key === " ") {
      var card = ev.target.closest(".proj-card");
      if (card) { ev.preventDefault(); openSheet(card.dataset.projId); }
    }
  });

  sheetClose.addEventListener("click", closeSheet);
  sheetOverlay.addEventListener("click", function (ev) {
    if (ev.target === sheetOverlay) closeSheet();
  });

  /* redirect modal for sheet links */
  sheetOverlay.addEventListener("click", function (ev) {
    var a = ev.target.closest(".sheet-ext-link");
    if (!a) return;
    ev.preventDefault();
    closeSheet();
    openRedirect(a.href, a.dataset.label || a.textContent);
  });

  /* ── KEYBOARD GLOBAL ──────────────────────────────────── */
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape") {
      if (!sheetOverlay.hasAttribute("hidden")) { closeSheet(); return; }
      if (!modal.hasAttribute("hidden"))        { closeRedirect(); }
    }
  });

  /* ── SITE NAV (section switcher) ──────────────────────── */
  var navTabs  = document.querySelectorAll(".nav-tab");
  var sections = document.querySelectorAll(".site-section");

  navTabs.forEach(function (tab) {
    tab.addEventListener("click", function () {
      showSection(tab.dataset.section);
    });
  });

  /* ── FOOTER ───────────────────────────────────────────── */
  document.getElementById("footer-text").textContent =
    d.name + " · " + new Date().getFullYear();

  var footerHire = document.getElementById("footer-hire");
  if (d.contact.hireMe) {
    footerHire.href = d.contact.hireMe;
    footerHire.removeAttribute("hidden");
    footerHire.addEventListener("click", function (ev) {
      ev.preventDefault();
      openRedirect(d.contact.hireMe, "Hire Me");
    });
  }
})();
</script>

</body>
</html>
